# Opt-in public HTTPS. Requires DNS pointing to this host and free ports 80/443.
# docker compose -f compose.yml -f deploy/compose.caddy.yml up -d --build --wait
services:
  app:
    environment:
      SKILLBOX_ORIGIN: https://${SKILLBOX_DOMAIN:?Set SKILLBOX_DOMAIN to your public DNS name}
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SKILLBOX_DOMAIN: ${SKILLBOX_DOMAIN:?Set SKILLBOX_DOMAIN to your public DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
volumes:
  caddy-data:
  caddy-config:
