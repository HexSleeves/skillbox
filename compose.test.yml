services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillbox_test
      POSTGRES_PASSWORD: isolated_test_only
      POSTGRES_DB: skillbox_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbox_test -d skillbox_test"]
      interval: 1s
      retries: 30
    mem_limit: 256m
  test:
    build:
      context: .
      target: build
    command: ["bun", "test"]
    environment:
      DATABASE_URL: postgres://skillbox_test:isolated_test_only@db:5432/skillbox_test
      SKILLBOX_ADMIN_TOKEN: isolated_test_admin_token_not_for_production
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
